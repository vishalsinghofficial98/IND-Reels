<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IND.Reels</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .reel {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      background: #111;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 18px;
      font-size: 24px;
      font-weight: bold;
      z-index: 2;
    }

    .info {
      position: absolute;
      bottom: 30px;
      left: 18px;
      right: 80px;
      z-index: 2;
      text-shadow: 0 2px 5px #000;
    }

    .info h3 {
      margin: 0 0 8px;
    }

    .info p {
      margin: 0;
    }

    .buttons {
      position: absolute;
      right: 15px;
      bottom: 35px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 2;
    }

    button {
      border: 0;
      background: rgba(0,0,0,.45);
      color: white;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      font-size: 22px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="reel">
    <div class="logo">🇮🇳 IND.Reels</div>

    <video autoplay muted loop playsinline>
      <source src="https://cdn.coverr.co/videos/coverr-a-woman-walking-in-the-city-1572/1080p.mp4" type="video/mp4">
    </video>

    <div class="info">
      <h3>@INDCreator</h3>
      <p>Welcome to IND.Reels 🇮🇳</p>
    </div>

    <div class="buttons">
      <button onclick="like(this)">❤️</button>
      <button>💬</button>
      <button onclick="share()">↗️</button>
    </div>
  </div>

  <div class="reel">
    <div class="logo">IND.Reels</div>

    <video autoplay muted loop playsinline>
      <source src="https://cdn.coverr.co/videos/coverr-a-man-walking-on-the-street-1575/1080p.mp4" type="video/mp4">
    </video>

    <div class="info">
      <h3>@INDCreator2</h3>
      <p>India's short video community 🔥</p>
    </div>

    <div class="buttons">
      <button onclick="like(this)">❤️</button>
      <button>💬</button>
      <button onclick="share()">↗️</button>
    </div>
  </div>

</div>

<script>
function like(btn) {
  btn.textContent = btn.textContent === "❤️" ? "💖" : "❤️";
}

function share() {
  if (navigator.share) {
    navigator.share({
      title: "IND.Reels",
      text: "Check out this Reel!"
    });
  } else {
    alert("Share feature coming soon!");
  }
}
</script>

</body>
</html>
